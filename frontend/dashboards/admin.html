<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Console — LabFlow Lite</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #111014; color: #F3F0F5; min-height: 100vh; }
        .card-dash { background-color: #211E27; border: 1px solid #38323F; border-radius: 0.75rem; padding: 2rem; box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
        .navbar-custom { background-color: #18161D !important; border-bottom: 1px solid #38323F !important; }
        .text-purple { color: #8B6FB3 !important; }
        .text-purple-light { color: #B99AD9 !important; }
        .badge-purple { background-color: rgba(139, 111, 179, 0.14); color: #8B6FB3; border: 1px solid rgba(139, 111, 179, 0.3); }
        .btn-purple { background-color: #8B6FB3; color: #FFFFFF; border: none; }
        .btn-purple:hover { background-color: #A184C7; color: #FFFFFF; }
        .btn-outline-custom { background-color: transparent; border: 1px solid #38323F; color: #B2AAB8; }
        .btn-outline-custom:hover { background-color: #292531; border-color: #8B6FB3; color: #F3F0F5; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-dark navbar-custom py-3">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="#">
                <i class="bi bi-cpu-fill text-purple"></i> LabFlow Lite
            </a>
            <div class="d-flex align-items-center gap-3">
                <span class="badge badge-purple px-3 py-2 rounded-pill"><i class="bi bi-shield-lock me-1"></i> Admin Console</span>
                <button class="btn btn-outline-danger btn-sm rounded-pill px-3" onclick="logout()">
                    <i class="bi bi-box-arrow-right me-1"></i> Sign Out
                </button>
            </div>
        </div>
    </nav>

    <div class="container my-auto py-5">
        <div class="card-dash max-w-700 mx-auto text-center" style="max-width: 680px;">
            <div class="display-6 fw-bold text-white mb-2">Administrator Console</div>
            <p class="text-secondary fs-5 mb-4" style="color: #B2AAB8 !important;">System administration &amp; college lab governance.</p>
            <div class="p-3 rounded border text-start mb-4" style="background-color: #19171F; border-color: #38323F !important;">
                <div class="text-purple fw-semibold small mb-1"><i class="bi bi-shield-check me-1"></i> Administrative Session Active</div>
                <div class="small" style="color: #B2AAB8;">Full system permissions. Manage college labs, user accounts, and system configuration.</div>
            </div>
            <div class="d-flex justify-content-center gap-3">
                <a href="/" class="btn btn-outline-custom rounded-pill px-4">Landing Page</a>
                <button class="btn btn-danger rounded-pill px-4" onclick="logout()">Logout</button>
            </div>
        </div>
    </div>

    <script>
        async function logout() {
            try {
                await fetch('/api/auth/logout', { method: 'POST' });
                window.location.href = '/login';
            } catch (e) {
                window.location.href = '/login';
            }
        }
    </script>
</body>
</html>
